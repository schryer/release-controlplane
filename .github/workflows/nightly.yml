# Every night: pubkit's nightly on what schryer's state.json governs.
# It sends no Slack message: pull requests and failed runs reach you through GitHub.
name: nightly

on:
  schedule: [{ cron: '41 2 * * *' }]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      repos: ${{ steps.plan.outputs.repos }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.14' }
      - run: python -m pip install --quiet --only-binary ':all:' --require-hashes -r tests/requirements.lock
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: '${{ vars.RELEASE_READER_APP_ID }}'
          private-key: '${{ secrets.RELEASE_READER_APP_KEY }}'
          owner: schryer
      - id: plan
        run: |
          gh api -H 'Accept: application/vnd.github.raw+json' repos/schryer/release-state/contents/state.json > state.json
          echo "repos=$(pubkit state --repos-for govern state.json)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: '${{ steps.app.outputs.token }}'

  update:
    needs: plan
    if: needs.plan.outputs.repos != '{"repositories":[]}'
    uses: Sustenaut/pubkit/.github/workflows/nightly.yml@0c1f1c3ff98315c6eabad6b58ba9fad79374572a # v0.31.0
    with: { repos: '${{ needs.plan.outputs.repos }}' }
    secrets:
      app-id: '${{ vars.NIGHTLY_APP_ID }}'
      app-key: '${{ secrets.NIGHTLY_APP_KEY }}'
