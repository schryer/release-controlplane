# Every night: pubfleet's nightly on what schryer's state.json governs.
# It sends no Slack message: pull requests and failed runs reach you through GitHub.
name: nightly

on:
  schedule: [{ cron: '41 2 * * *' }]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      repos: ${{ steps.plan.outputs.repos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.14' }
      - run: python -m pip install --quiet --only-binary ':all:' --require-hashes -r tests/requirements.lock
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: '${{ vars.RELEASE_READER_APP_ID }}'
          private-key: '${{ secrets.RELEASE_READER_APP_KEY }}'
          owner: schryer
      - id: plan
        run: |
          gh api -H 'Accept: application/vnd.github.raw+json' repos/schryer/release-state/contents/state.json > state.json
          echo "repos=$(pubfleet state --repos-for govern state.json)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: '${{ steps.app.outputs.token }}'

  update:
    needs: plan
    if: needs.plan.outputs.repos != '{"repositories":[]}'
    uses: Sustenaut/pubfleet/.github/workflows/nightly.yml@45799e0bac89dbd7747c99857631caef7dfb4e89 # v0.1.3
    with: { repos: '${{ needs.plan.outputs.repos }}' }
    secrets:
      app-id: '${{ vars.NIGHTLY_APP_ID }}'
      app-key: '${{ secrets.NIGHTLY_APP_KEY }}'
